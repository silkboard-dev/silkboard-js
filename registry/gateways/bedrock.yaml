# AWS Bedrock Gateway
# Regional pricing for models hosted on AWS infrastructure
gateway: bedrock
type: gateway
sdk: "@ai-sdk/amazon-bedrock"
env_keys:
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_REGION

regions:
  - us-east-1
  - us-west-2
  - eu-west-1
  - eu-central-1
  - ap-northeast-1
  - ap-southeast-1
  - ap-south-1

models:
  # ============================================================================
  # Anthropic Models on Bedrock
  # ============================================================================
  anthropic.claude-opus-4:
    author: anthropic
    model: claude-opus-4
    model_id: anthropic.claude-opus-4-20250514-v1:0
    regional_pricing:
      us-east-1:
        input: 15.00
        output: 75.00
      us-west-2:
        input: 15.00
        output: 75.00
      eu-west-1:
        input: 18.00  # 20% EU markup
        output: 90.00
      ap-northeast-1:
        input: 16.50  # 10% APAC markup
        output: 82.50

  anthropic.claude-sonnet-4:
    author: anthropic
    model: claude-sonnet-4
    model_id: anthropic.claude-sonnet-4-20250514-v1:0
    regional_pricing:
      us-east-1:
        input: 3.00
        output: 15.00
      us-west-2:
        input: 3.00
        output: 15.00
      eu-west-1:
        input: 3.60
        output: 18.00
      ap-northeast-1:
        input: 3.30
        output: 16.50

