# OpenRouter Gateway
# Aggregates models from multiple authors with unified API
gateway: openrouter
type: gateway
sdk: "@ai-sdk/openai-compatible"
sdk_options:
  name: openrouter
  baseURL: https://openrouter.ai/api/v1
env_key: OPENROUTER_API_KEY

# OpenRouter normalizes reasoning params
reasoning_normalization:
  anthropic:
    # OpenRouter caps Anthropic extended thinking at 32K
    max_tokens_override: 32000
    parameter: max_tokens
  openai:
    parameter: reasoning_effort
  google:
    parameter: thinking_budget

models:
