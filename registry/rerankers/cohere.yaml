# Cohere Reranker Models
provider: cohere
type: direct
sdk: "@ai-sdk/cohere"
env_key: COHERE_API_KEY

models:
  rerank-v3.5:
    model_id: rerank-v3.5
    max_documents: 1000
    max_query_length: 4096
    pricing:
      per_query: 0.02  # per 1K searches

  rerank-english-v3.0:
    model_id: rerank-english-v3.0
    max_documents: 1000
    max_query_length: 4096
    pricing:
      per_query: 0.02

  rerank-multilingual-v3.0:
    model_id: rerank-multilingual-v3.0
    max_documents: 1000
    max_query_length: 4096
    pricing:
      per_query: 0.02
