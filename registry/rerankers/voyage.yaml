# Voyage AI Reranker Models
provider: voyage
type: direct
sdk: voyageai  # Native SDK
env_key: VOYAGE_API_KEY

models:
  rerank-2:
    model_id: rerank-2
    max_documents: 1000
    max_query_length: 2000
    pricing:
      per_query: 0.05  # per 1M tokens searched

  rerank-2-lite:
    model_id: rerank-2-lite
    max_documents: 1000
    max_query_length: 2000
    pricing:
      per_query: 0.02
